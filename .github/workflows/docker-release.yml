name: package and push docker (release)

on:
  release:
    types: [released]

jobs:
  build:
    # 仅对 v* 形式的正式版本标签构建（release-please 通过 API 创建标签，不会触发 push 事件）
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml

      - name: Build frontend
        run: |
          cd ui
          pnpm install --frozen-lockfile
          pnpm run build

      - name: Copy frontend build to backend static resources
        run: |
          mkdir -p api/src/main/resources/static
          cp -r ui/dist/* api/src/main/resources/static/

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build backend with Maven
        run: mvn -f api/pom.xml clean package

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Set image name
        id: image
        run: |
          echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/anilinkserver" >> "$GITHUB_OUTPUT"

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=latest
            type=semver,pattern={{version}}
            type=semver,pattern=v{{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}

      - name: Update package description from release notes
        env:
          # 默认用 GITHUB_TOKEN；如配置了 PACKAGES_PAT secret 则优先使用（更新描述可能要求 PAT）
          GH_TOKEN: ${{ secrets.PACKAGES_PAT || secrets.GITHUB_TOKEN }}
          PACKAGE_NAME: anilinkserver
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          # 从事件文件提取 release-please 写入的更新内容，构造 JSON 载荷（避免多行/引号转义问题）
          jq -n --arg d "$(jq -r '.release.body // ""' "$GITHUB_EVENT_PATH")" '{description: $d}' > /tmp/package-desc.json
          # owner 为组织时使用 orgs/{owner} 端点，否则使用 user 端点
          if curl -fsS -H "Authorization: Bearer ${GH_TOKEN}" \
            "https://api.github.com/orgs/${OWNER}" > /dev/null 2>&1; then
            endpoint="orgs/${OWNER}"
          else
            endpoint="user"
          fi
          echo "Updating package description: /${endpoint}/packages/container/${PACKAGE_NAME}"
          curl -fsS -X PATCH \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/${endpoint}/packages/container/${PACKAGE_NAME}" \
            --data-binary @/tmp/package-desc.json
